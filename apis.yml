name: ecoplanet
description: 'ecoplanet provides cloud-based, integrated energy management software for German
  mid-market companies. The platform combines three core functions: real-time consumption monitoring
  through meter integration with AI-powered anomaly detection and automated load-shifting on price
  signals; strategic energy procurement using algorithmic purchasing across spot markets, tranches,
  and power purchase agreements (PPAs); and automated ISO 50001 compliance documentation. The company
  reports customers achieve up to 15% consumption savings and ~13.9% average price advantages on energy
  purchases. Backed by EQT Ventures and HV Capital. No public developer/API surface was found at the
  time of profiling.'
